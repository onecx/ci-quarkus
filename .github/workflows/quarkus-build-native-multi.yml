name: quarkus

on:
  workflow_call:
    inputs:
      jdk:
        description: 'JDK version'
        default: '25'
        required: false
        type: string
      push:
        description: 'Push docker image'
        default: false
        required: false
        type: boolean
      platform:
        description: 'Docker platforms'
        default: ''
        required: false
        type: string
      args:
        description: 'Comma-separated, additional arguments to pass to the build process.'
        default: ''
        required: false
        type: string
      arch:
        description: 'List of archs. Values: [ arm64, x86_64 ]. Default: x86_64, arm64'
        default: '[ "arm64", "x86_64" ]'
        required: false
        type: string
      graalvm-version:
        description: 'GraalVM version (release, latest, dev). Default: empty-string or latest.'
        default: '25.0.2.0-Final'
        required: false
        type: string

jobs:
  maven:
    name: quarkus native build and test
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: ${{ fromJson(inputs.arch) }}
    env:
      QUARKUS_CONTAINER_IMAGE_REGISTRY: 'ghcr.io'
      QUARKUS_CONTAINER_IMAGE_GROUP: ${{ github.repository_owner }}
      QUARKUS_CONTAINER_IMAGE_BUILD: 'true'
      QUARKUS_CONTAINER_IMAGE_PUSH: ${{ inputs.push }}
      QUARKUS_DOCKER_BUILDX_PLATFORM: ${{ inputs.platform }}
      QUARKUS_DOCKER_ADDITIONAL_ARGS: "--provenance=false"
      QUARKUS_NATIVE_ADDITIONAL_BUILD_ARGS: ${{ inputs.args }}
      SAMO_DOCKER_TAG_TEMPLATE_LIST: '{{ .Branch }}-native'
      QUARKUS_DEVSERVICES_TIMEOUT: "120S"
      SAMO_CONVENTIONAL_COMMITS: 'true'
    steps:
    # install samo tool
    - uses: lorislab/install-samo-action@v2
      with:
        platform: ${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}
    # checkout the project
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    # set up java and maven cache
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: ${{ inputs.jdk }}
        cache: 'maven'
    - uses: graalvm/setup-graalvm@v1
      with:
        java-version: ${{ inputs.jdk }}
        distribution: 'mandrel' # See 'Options' for all available distributions
        github-token: ${{ secrets.GITHUB_TOKEN }}
        version: ${{ inputs.graalvm-version }}
    # setup github docker registry in the organization
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ${{ env.QUARKUS_CONTAINER_IMAGE_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # set build env variables
    - name: Create build env variables
      run: |
        echo "QUARKUS_APPLICATION_VERSION=$(samo project version)" >> $GITHUB_ENV
        echo "QUARKUS_CONTAINER_IMAGE_TAG=$(samo project version)-native-$MATRIX_ARCH" >> $GITHUB_ENV
        echo "CONTAINER_NAME=${{ env.QUARKUS_CONTAINER_IMAGE_REGISTRY }}/${{ env.QUARKUS_CONTAINER_IMAGE_GROUP }}/$(samo project name)" >> $GITHUB_ENV
        echo >> src/main/resources/application.properties
        echo quarkus.docker.build-args.BUILDKIT_MULTI_PLATFORM=true >> src/main/resources/application.properties
        samo project docker labels >> src/main/resources/application.properties
      env:
        SAMO_DOCKER_LABEL_TEMPLATE: 'quarkus.container-image.labels."{{ .Key }}"={{ .Value }}'
        MATRIX_ARCH: ${{ matrix.arch }}
    - name: Add docker annotations for multi-platform docker images
      if: inputs.platform != ''
      run: |
        echo >> src/main/resources/application.properties
        samo project docker annotations >> src/main/resources/application.properties
      env:
        SAMO_DOCKER_ANNOTATION_TEMPLATE: 'quarkus.docker.buildx.output=type=image,{{ range $index, $item := .Annotations }}{{if $index}},{{end}}annotation-index.{{ $item.Key }}={{ $item.Value}}{{ end }}'
    # build JVM version
    - name: Build native project, run tests and push docker image
      run: mvn -ntp -B -e -DskipUTs=true -Dnative clean impsort:check formatter:validate verify --file pom.xml  
    # upload target for next jobs
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: package-native-${{ matrix.arch }}
        path: target
        retention-days: 1
        if-no-files-found: ignore
    - name: Create digest
      if: ${{ !cancelled() && inputs.push }}
      run: |
         echo "DIGEST=$(docker buildx imagetools inspect $CONTAINER_NAME:$QUARKUS_CONTAINER_IMAGE_TAG --format '{{json .Manifest}}' | jq -r '.digest' | awk -F':' '{print $2}')" >> $GITHUB_ENV
    - name: Export digests
      if: ${{ !cancelled() && inputs.push }}
      run: |
        mkdir -p ${{ runner.temp }}/digests
        touch "${{ runner.temp }}/digests/${{ env.DIGEST }}"
    - name: Upload digest info
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() && inputs.push }}
      with:
        name: digests-${{ env.MATRIX_ARCH }}
        path: ${{ runner.temp }}/digests/*
        retention-days: 1
        if-no-files-found: error
      env:
        MATRIX_ARCH: ${{ matrix.arch }}
    # Run docker image trivy scan
    - name: Run Trivy vulnerability scanner for native app docker image
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: aquasecurity/trivy-action@0.35.0
      with:
        image-ref: 'ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ env.QUARKUS_CONTAINER_IMAGE_TAG }}'
        severity: 'HIGH,CRITICAL'
        format: table
  merge:
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    needs:
      - maven
    env:
      QUARKUS_CONTAINER_IMAGE_REGISTRY: 'ghcr.io'
      QUARKUS_CONTAINER_IMAGE_GROUP: ${{ github.repository_owner }}
      SAMO_DOCKER_TAG_TEMPLATE_LIST: '{{ .Branch }}-native'
      SAMO_CONVENTIONAL_COMMITS: 'true'
    steps:
      # install samo tool
      - uses: lorislab/install-samo-action@v2
      # checkout the project
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.QUARKUS_CONTAINER_IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create version
        run: |
          echo "PROJECT_IMAGE_TAG=$(samo project version)-native" >> $GITHUB_ENV
          echo "PROJECT_IMAGE_BRANCH_TAG=$(samo project docker tags)" >> $GITHUB_ENV
          echo "PROJECT_IMAGE=${{ env.QUARKUS_CONTAINER_IMAGE_REGISTRY }}/${{ env.QUARKUS_CONTAINER_IMAGE_GROUP }}/$(samo project name)" >> $GITHUB_ENV
          echo "PROJECT_IMAGE_ANO=$(samo project docker annotations)" >> $GITHUB_ENV
        env:
          SAMO_DOCKER_ANNOTATION_TEMPLATE: '{{ range $index, $item := .Annotations }}{{if $index}} {{end}}--annotation "index:{{ $item.Key }}={{ $item.Value}}"{{ end }}'
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t ${{ env.PROJECT_IMAGE }}:${{ env.PROJECT_IMAGE_TAG }} -t ${{ env.PROJECT_IMAGE }}:${{ env.PROJECT_IMAGE_BRANCH_TAG }} \
            ${{ env.PROJECT_IMAGE_ANO }} \
            $(printf '${{ env.PROJECT_IMAGE }}@sha256:%s ' *)
